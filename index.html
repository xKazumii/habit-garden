<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Habit Garden</title>
    <meta
      name="description"
      content="Ein digitaler Garten für deine Gewohnheiten. Jede Gewohnheit ist eine Pflanze — erledige sie, gieße sie, sieh sie wachsen."
    />
    <!-- Matches the app background so the status bar looks seamless.
         The value here is the light variant and must agree with THEME_COLOR in
         vite.config.ts. In dark mode the script below writes the dark variant
         in its place. -->
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Habit Garden" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!--
      Sets the theme BEFORE first paint. A React effect would only run afterwards,
      so the app would briefly flash light while loading.

      The three values are duplicated on purpose: here and in src/config/theme.ts.
      This script has to run before the bundle and therefore cannot import
      anything. src/lib/theme.test.ts compares both places.
    -->
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('habit-garden-theme')
          const dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)

          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', dark ? '#1B241E' : '#FAF7F2')
        } catch {
          /* Private mode without localStorage: light it is. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
