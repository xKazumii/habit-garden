name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One-time setup: Settings -> Pages -> Source must be set to "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do not cancel a running one, so a deployment in
# progress is never left half finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The growth logic is the core of the app — no deployment without green tests.
      - run: npm test

      # Already includes the type check (tsc -b && vite build).
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
