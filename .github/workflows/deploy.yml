name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Einmalig nötig: Settings → Pages → Source auf "GitHub Actions" stellen.
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig. Laufende nicht abbrechen, damit ein
# angefangenes Deployment nicht auf halber Strecke stehen bleibt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Die Wachstumslogik ist der Kern der App — kein Deployment ohne grüne Tests.
      - run: npm test

      # Enthält bereits den Typecheck (tsc -b && vite build).
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
